services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodflow
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodflow}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U foodflow -d foodflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://foodflow:${POSTGRES_PASSWORD:-foodflow}@db:5432/foodflow?sslmode=disable
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    environment:
      DATABASE_URL: postgres://foodflow:${POSTGRES_PASSWORD:-foodflow}@db:5432/foodflow?sslmode=disable
      HTTP_ADDR: :8080
      APP_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_ACCESS_KEY_ID: ${SMS_ACCESS_KEY_ID:-}
      SMS_ACCESS_KEY_SECRET: ${SMS_ACCESS_KEY_SECRET:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      VISION_MODEL_NAME: ${VISION_MODEL_NAME:-}
      VISION_MODEL_ENDPOINT: ${VISION_MODEL_ENDPOINT:-}
      VISION_MODEL_API_KEY: ${VISION_MODEL_API_KEY:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      IMAGE_STORAGE_DIR: /app/data/images
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes: [image_data:/app/data/images]
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["8080:8080"]
    healthcheck:
      test: [CMD, "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    build: .
    command: ["/app/worker"]
    environment:
      MARKET_PRICE_SYNC: ${MARKET_PRICE_SYNC:-true}
      DATABASE_URL: postgres://foodflow:${POSTGRES_PASSWORD:-foodflow}@db:5432/foodflow?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_ACCESS_KEY_ID: ${SMS_ACCESS_KEY_ID:-}
      SMS_ACCESS_KEY_SECRET: ${SMS_ACCESS_KEY_SECRET:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      VISION_MODEL_NAME: ${VISION_MODEL_NAME:-}
      VISION_MODEL_ENDPOINT: ${VISION_MODEL_ENDPOINT:-}
      VISION_MODEL_API_KEY: ${VISION_MODEL_API_KEY:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      IMAGE_STORAGE_DIR: /app/data/images
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes: [image_data:/app/data/images]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: ./web
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  pgdata:
  image_data:
