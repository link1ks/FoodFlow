      summary: 家庭已完成餐次营养估算
      description: >-
        使用实际打卡时间、历史时区及份数快照，按 g/kg
        消耗流水乘每100g参考组成。每日数值为该日各餐的人均估算之和；无记录或全部不可计算时为null。按个和体积计量缺少质量换算时列入excluded，不伪造零。连续三天各有三餐且全部条目可计算时才启用低蛋白标签参考提示。仅为原料组成估算，不代表实际摄入或医疗评分。
