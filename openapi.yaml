      - $ref: '#/components/parameters/household'
    get:
      summary: 家庭金额与数量月报
      description: 厨房主库一致读；按家庭时区半开月份窗口。采购额按成本记录日期，消耗/报损仅使用不可变出库成本快照；未知不补价，金额为 CNY 已知小计。按历史名称和单位分组，明细最多 200 组，总计不截断。
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}$
          description: 默认家庭当前月份；年份 1970–9998
      responses:
        '200':
          description: 月报与成本覆盖
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReport'
        '400':
          description: 月份无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 输入、身份、权限、并发、限流或服务失败；具体 error 说明原因
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 输入、身份、权限、并发、限流或服务失败；具体 error 说明原因
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 无家庭访问权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 输入、身份、权限、并发、限流或服务失败；具体 error 说明原因
          content:
            application/json:
              schema:
