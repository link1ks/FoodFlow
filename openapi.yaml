      description: >-
        最多7餐、20道候选菜谱、128个批次和64种食材单位组合。每餐一道菜，最多50000搜索节点，命中上限返回truncated。数量先按人数精确缩放，克/毫升/个互不混算。优先消耗当前48小时内临期批次；各餐按家庭时区与预计餐时排除已过期批次。仅保存方案，不预留或扣减库存。
