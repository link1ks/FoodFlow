  /households/{household}/insights:
    parameters:
      - $ref: '#/components/parameters/household'
    get:
      summary: 厨房收支统计（独立服务投影）
      description: 服务端校验当前家庭权限后请求统计服务；事件最终一致，按食材与原单位分组，数量毫单位以字符串返回。不合并质量、体积与计数。仅覆盖有历史快照的库存流水。
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}$
          description: 默认家庭时区的当前月份
      responses:
        '200':
          description: 月份、时区、最后事件接收时间与收支明细
          content:
            application/json:
              schema:
                type: object
                required:
                  - month
                  - timezone
                  - items
                  - consistency
                  - coverage
                properties:
                  month:
                    type: string
                  timezone:
                    type: string
                  consistency:
                    type: string
                    enum:
                      - eventual
                  coverage:
                    type: string
                  last_received_at:
                    type: string
                    format: date-time
                    nullable: true
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        ingredient:
                          type: string
                        category:
                          type: string
                        unit:
                          type: string
                        inbound_milli:
                          type: string
                        consumed_milli:
                          type: string
                        wasted_milli:
                          type: string
                        adjusted_milli:
                          type: string
        '400':
          description: 月份无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 需要登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 输入、身份、权限、并发、限流或服务失败；具体 error 说明原因
