  /households/{household}/jobs/advice:
    parameters:
      - $ref: '#/components/parameters/household'
      - $ref: '#/components/parameters/idempotency'
    post:
      summary: 根据所选有效库存与参考营养数据生成搭配建议
      description: >-
        仅编辑成员可提交。所有ID在服务端及Worker内检查家庭归属与有效库存。相同幂等键和请求重放原任务，不额外调用模型；相同键不同请求409。一次模型请求，输出1600
        token上限，25秒超时，总任务35秒；真实模型失败仅手动重试。结果为建议，不修改菜单、采购或库存。建议结果含mode、summary、tips、recipes和selected_inventory快照；未配置模型则mode为demo。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - selected_ingredient_ids
                - servings
                - max_minutes
              properties:
                selected_ingredient_ids:
                  type: array
                  minItems: 1
                  maxItems: 30
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                servings:
                  type: integer
                  minimum: 1
                  maximum: 20
                max_minutes:
                  type: integer
                  minimum: 1
                  maximum: 240
                goal:
                  type: string
                  maxLength: 500
      responses:
        '202':
          description: 任务ID；通过 jobs/{job} 查询或取消
