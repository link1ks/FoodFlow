openapi: 3.0.3
info:
  title: FoodFlow 食光 API
  version: 0.2.0
  description: 家庭食材、菜单、采购和后台任务 API。数量均为最多三位小数的字符串。
servers:
  - url: http://localhost:8080/api
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    household:
      name: household
      in: path
      required: true
      schema:
        type: string
        format: uuid
    plan:
      name: plan
      in: path
      required: true
      schema:
        type: string
        format: uuid
    item:
      name: item
      in: path
      required: true
      schema:
        type: string
        format: uuid
    job:
      name: job
      in: path
      required: true
      schema:
        type: string
        format: uuid
    idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 120
  schemas:
    NutritionProfile:
      type: object
      description: 目录与库存 item.nutrition 字段。每100克可食部参考组成，不是实际批次检测或库存总营养。缺失项省略，不能当作零。
      properties:
        status:
          type: string
          enum:
            - reference
            - unavailable
        basis:
          type: string
        reference_food:
          type: string
        source:
          type: string
        source_id:
          type: string
        source_url:
          type: string
          format: uri
        note:
          type: string
        nutrients:
          type: object
          properties:
            energy_kcal:
              type: string
            protein_g:
              type: string
            fat_g:
              type: string
            carbs_g:
              type: string
            fiber_g:
              type: string
            sodium_mg:
              type: string
          additionalProperties:
            type: string
      required:
        - status
        - basis
        - note
        - nutrients
    Benchmark:
      type: object
      properties:
        id:
          type: string
        city:
          type: string
        ingredient_name:
          type: string
        category:
          type: string
        price:
          type: string
        unit:
          type: string
          enum:
            - 500g
            - 1kg
            - 个
            - 1l
        source_agency:
          type: string
        source_url:
          type: string
          format: uri
        source_item_name:
          type: string
        specification:
          type: string
        price_type:
          type: string
          enum:
            - retail_monitor
            - wholesale_monitor
            - government_guidance
        recorded_date:
          type: string
          format: date
        period_start:
          type: string
          format: date
        collected_at:
          type: string
          format: date-time
        historical:
          type: boolean
        weekly_change_percent:
          type: string
          nullable: true
          description: 仅 dashboard 返回；缺少上周同口径数据时为 null
    Credentials:
      type: object
      required:
        - password
      description: 推荐account统一输入手机号或邮箱；也兼容email与phone。三者只能传一个。注册需name，手机号注册还需register用途的challenge_id和code。密码限制8至72字节。
      oneOf:
        - required:
            - email
          not:
            anyOf:
              - required:
                  - phone
              - required:
                  - account
        - required:
            - phone
          not:
            anyOf:
              - required:
                  - email
              - required:
                  - account
        - required:
            - account
          not:
            anyOf:
              - required:
                  - email
              - required:
                  - phone
      properties:
        account:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: ^(\+86)?1[3-9][0-9]{9}$
        password:
          type: string
          minLength: 8
        name:
          type: string
        code:
          type: string
        challenge_id:
          type: string
          format: uuid
    SMSProof:
      type: object
      required:
        - phone
        - code
        - challenge_id
      properties:
        phone:
          type: string
        code:
          type: string
          pattern: ^[0-9]{6}$
        challenge_id:
          type: string
          format: uuid
        password:
          type: string
          description: 绑定手机号时必须提供当前密码
    Quantity:
      type: string
      pattern: ^[0-9]+(\.[0-9]{1,3})?$
      example: '300.000'
    Meal:
      type: object
      required:
        - day
        - meal
        - servings
        - recipe_id
      properties:
        day:
          type: string
          format: date
        meal:
          type: string
          enum:
            - breakfast
            - lunch
            - dinner
        servings:
          type: integer
          minimum: 1
          maximum: 20
        recipe_id:
          type: string
          format: uuid
        additional_recipe_ids:
          type: array
          maxItems: 19
          uniqueItems: true
          items:
            type: string
            format: uuid
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    HouseholdCreated:
      properties:
        id:
          format: uuid
          type: string
      required:
        - id
      type: object
    InventoryItem:
      properties:
        category:
          type: string
        dimension:
          type: string
        has_image:
          type: boolean
        id:
          format: uuid
          type: string
        image_version:
          minimum: 0
          type: integer
        low:
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          type: string
        low_stock:
          type: boolean
        name:
          type: string
        nutrition:
          $ref: '#/components/schemas/NutritionProfile'
        quantity:
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          type: string
        unit:
          type: string
      required:
        - id
        - name
        - category
        - unit
        - dimension
        - quantity
        - low
        - low_stock
        - has_image
        - image_version
      type: object
    InventoryBatch:
      properties:
        bought_on:
          type: string
        condition:
          type: string
        expires_at:
          type: string
        expires_on:
          type: string
        expiry_kind:
          enum:
            - unknown
            - user
            - label
            - estimate
          type: string
        id:
          format: uuid
          type: string
        ingredient_id:
          format: uuid
          type: string
        location:
          type: string
        quantity:
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          type: string
        source:
          type: string
      required:
        - id
        - ingredient_id
        - quantity
        - location
        - bought_on
        - expires_on
        - expires_at
        - expiry_kind
        - source
        - condition
      type: object
    CatalogItem:
      properties:
        aliases:
          items:
            type: string
          type: array
        category:
          type: string
        default_unit:
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        nutrition:
          $ref: '#/components/schemas/NutritionProfile'
      required:
        - id
        - name
        - category
        - default_unit
        - aliases
        - nutrition
      type: object
    MealCompleted:
      properties:
        day:
          format: date
          type: string
        meal:
          type: string
        plan_id:
          format: uuid
          type: string
        plan_meal_id:
          format: uuid
          type: string
        status:
          enum:
            - consumed
          type: string
      required:
        - plan_id
        - plan_meal_id
        - day
        - meal
        - status
      type: object
    Session:
      properties:
        expires_at:
          format: date-time
          type: string
        token:
          type: string
        token_type:
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - user_id
        - token
        - token_type
        - expires_at
      type: object
    StockCreated:
      properties:
        batch_id:
          format: uuid
          type: string
        ingredient_id:
          format: uuid
          type: string
      required:
        - ingredient_id
        - batch_id
      type: object
    Inventory:
      properties:
        batches:
          items:
            $ref: '#/components/schemas/InventoryBatch'
          type: array
        items:
          items:
            $ref: '#/components/schemas/InventoryItem'
          type: array
      required:
        - items
        - batches
      type: object
    RecipeIngredient:
      properties:
        name:
          type: string
        quantity:
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          type: string
        unit:
          type: string
      required:
        - name
        - quantity
        - unit
      type: object
    PlanCreated:
      properties:
        id:
          format: uuid
          type: string
        status:
          enum:
            - draft
          type: string
      required:
        - id
        - status
      type: object
    Dish:
      properties:
        id:
          format: uuid
          type: string
        minutes:
          minimum: 0
          type: integer
        title:
          type: string
      required:
        - id
        - title
        - minutes
      type: object
    PlanDemand:
      properties:
        available:
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          type: string
        conversion_needs_confirmation:
          type: boolean
        name:
          type: string
        needed:
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          type: string
        shortage:
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          type: string
        unit:
          type: string
      required:
        - name
        - unit
        - needed
        - available
        - shortage
        - conversion_needs_confirmation
      type: object
    PlanConfirmed:
      properties:
        shopping_list_id:
          format: uuid
          type: string
        shortages_rechecked:
          type: boolean
      required:
        - shopping_list_id
        - shortages_rechecked
      type: object
    Recipe:
      properties:
        id:
          format: uuid
          type: string
        ingredients:
          items:
            $ref: '#/components/schemas/RecipeIngredient'
          type: array
        minutes:
          minimum: 0
          type: integer
        servings:
          minimum: 0
          type: integer
        source:
          type: string
        steps:
          items:
            type: string
          type: array
        tags:
          items:
            type: string
          type: array
        title:
          type: string
      required:
        - id
        - title
        - servings
        - minutes
        - tags
        - steps
        - source
        - ingredients
      type: object
    PlanMeal:
      properties:
        additional_recipes:
          items:
            $ref: '#/components/schemas/Dish'
          type: array
        day:
          type: string
        id:
          format: uuid
          type: string
        meal:
          type: string
        minutes:
          minimum: 0
          type: integer
        recipe_id:
          format: uuid
          type: string
        servings:
          minimum: 0
          type: integer
        title:
          type: string
      required:
        - id
        - day
        - meal
        - servings
        - recipe_id
        - title
        - minutes
        - additional_recipes
      type: object
    Plan:
      properties:
        id:
          format: uuid
          type: string
        ingredients:
          items:
            $ref: '#/components/schemas/PlanDemand'
          type: array
        inventory_rechecked_at:
          format: date-time
          type: string
        meals:
          items:
            $ref: '#/components/schemas/PlanMeal'
          type: array
        revision:
          minimum: 0
          type: integer
        status:
          type: string
      required:
        - id
        - status
        - revision
        - meals
        - ingredients
        - inventory_rechecked_at
      type: object
    ShoppingItem:
      properties:
        bought:
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          type: string
        checked:
          type: boolean
        id:
          format: uuid
          type: string
        list_id:
          format: uuid
          type: string
        name:
          type: string
        needed:
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          type: string
        origin:
          type: string
        plan_id:
          type: string
        stocked:
          type: boolean
        unit:
          type: string
      required:
        - id
        - list_id
        - plan_id
        - name
        - unit
        - needed
        - bought
        - checked
        - stocked
        - origin
      type: object
    ShoppingStocked:
      properties:
        batch_id:
          format: uuid
          type: string
        quantity:
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          type: string
      required:
        - batch_id
        - quantity
      type: object
    LedgerEntry:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        ingredient:
          type: string
        quantity:
          pattern: ^-?[0-9]+(\.[0-9]{1,3})?$
          type: string
        reason:
          type: string
        unit:
          type: string
      required:
        - id
        - ingredient
        - unit
        - quantity
        - reason
        - created_at
      type: object
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        phone_verified:
          type: boolean
        timezone:
          type: string
        remind_days:
          type: integer
      required:
        - id
        - name
        - email
        - phone
        - phone_verified
        - timezone
        - remind_days
    HouseholdSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
            - owner
            - editor
            - viewer
        servings:
          type: integer
      required:
        - id
        - name
        - role
        - servings
    HouseholdDetails:
      allOf:
        - $ref: '#/components/schemas/HouseholdSummary'
        - type: object
          properties:
            preferences:
              type: string
            excluded_ingredients:
              type: array
              items:
                type: string
          required:
            - preferences
            - excluded_ingredients
    SMSChallenge:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_in:
          type: integer
        retry_after:
          type: integer
      required:
        - challenge_id
        - expires_in
        - retry_after
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
      required:
        - id
        - name
        - email
        - role
    TodayMeal:
      type: object
      properties:
        plan_id:
          type: string
          format: uuid
        meal_id:
          type: string
          format: uuid
        meal:
          type: string
        servings:
          type: integer
        title:
          type: string
        minutes:
          type: integer
        status:
          type: string
      required:
        - plan_id
        - meal_id
        - meal
        - servings
        - title
        - minutes
        - status
    RecipeRequirement:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string
        needed:
          $ref: '#/components/schemas/Quantity'
        selected_available:
          $ref: '#/components/schemas/Quantity'
        shortage:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          nullable: true
        unit_needs_confirmation:
          type: boolean
      required:
        - name
        - unit
        - needed
        - selected_available
        - shortage
        - unit_needs_confirmation
    RecipeOption:
      type: object
      properties:
        recipe_id:
          type: string
          format: uuid
        title:
          type: string
        minutes:
          type: integer
        tags:
          type: array
          items:
            type: string
        status:
          type: string
        matched_ingredients:
          type: integer
        missing_ingredients:
          type: integer
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/RecipeRequirement'
      required:
        - recipe_id
        - title
        - minutes
        - tags
        - status
        - matched_ingredients
        - missing_ingredients
        - requirements
    BatchCost:
      type: object
      properties:
        recorded:
          type: boolean
        total_cost:
          type: string
        currency:
          type: string
          enum:
            - CNY
        purchase_quantity:
          $ref: '#/components/schemas/Quantity'
        recorded_at:
          type: string
          format: date-time
      required:
        - recorded
    QueuedJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
      required:
        - id
    JobSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
        progress:
          type: integer
        attempts:
          type: integer
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - kind
        - status
        - progress
        - attempts
        - error
        - created_at
        - updated_at
    JobDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
        progress:
          type: integer
        attempts:
          type: integer
        error:
          type: string
        payload:
          type: object
          additionalProperties: true
          nullable: true
        result:
          type: object
          additionalProperties: true
          nullable: true
      required:
        - id
        - kind
        - status
        - progress
        - attempts
        - error
        - payload
        - result
    PipelineStep:
      type: object
      properties:
        index:
          type: integer
        dish:
          type: string
        action:
          type: string
        source:
          type: string
        resources:
          type: integer
        dependencies:
          type: array
          items:
            type: integer
          nullable: true
        duration:
          type: integer
        start:
          type: integer
        end:
          type: integer
        earliest:
          type: integer
        latest:
          type: integer
      required:
        - index
        - dish
        - action
        - source
        - resources
        - dependencies
        - duration
        - start
        - end
        - earliest
        - latest
    PipelineSchedule:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStep'
        duration:
          type: integer
        deadline_met:
          type: boolean
        revision:
          type: integer
      required:
        - steps
        - duration
        - deadline_met
        - revision
    PipelineSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        starts_at:
          type: string
          format: date-time
        target_at:
          type: string
          format: date-time
        schedule:
          $ref: '#/components/schemas/PipelineSchedule'
        progress:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              started_at:
                type: string
                format: date-time
                nullable: true
              completed_at:
                type: string
                format: date-time
                nullable: true
            required:
              - index
              - started_at
              - completed_at
      required:
        - id
        - status
        - starts_at
        - target_at
        - schedule
        - progress
    MultiMealUse:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          type: string
        quantity:
          $ref: '#/components/schemas/Quantity'
        expiry_kind:
          type: string
      required:
        - batch_id
        - name
        - unit
        - quantity
        - expiry_kind
    MultiMealResult:
      type: object
      properties:
        meals:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
                format: date
              meal:
                type: string
              recipe_id:
                type: string
                format: uuid
              title:
                type: string
              minutes:
                type: integer
              uses:
                type: array
                items:
                  $ref: '#/components/schemas/MultiMealUse'
                nullable: true
              rollover:
                type: array
                items:
                  $ref: '#/components/schemas/MultiMealUse'
                nullable: true
              at_risk:
                type: array
                items:
                  $ref: '#/components/schemas/MultiMealUse'
                nullable: true
            required:
              - day
              - meal
              - recipe_id
              - title
              - minutes
              - uses
              - rollover
              - at_risk
        truncated:
          type: boolean
        nodes:
          type: integer
        score:
          type: number
      required:
        - meals
        - truncated
        - nodes
        - score
    Pantry:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              batch_id:
                type: string
                format: uuid
              name:
                type: string
              unit:
                type: string
              capacity:
                $ref: '#/components/schemas/Quantity'
              quantity:
                $ref: '#/components/schemas/Quantity'
              threshold:
                type: integer
              active:
                type: boolean
              usable:
                type: boolean
            required:
              - id
              - batch_id
              - name
              - unit
              - capacity
              - quantity
              - threshold
              - active
              - usable
        options:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              unit:
                type: string
              basis:
                type: array
                items:
                  type: string
            required:
              - name
              - unit
              - basis
      required:
        - items
        - options
    NutritionBasis:
      type: object
      properties:
        recorded:
          type: boolean
        revision:
          type: integer
        quantity:
          $ref: '#/components/schemas/Quantity'
        edible_grams:
          $ref: '#/components/schemas/Quantity'
        classification:
          type: string
          enum:
            - catalog
            - dark
            - other
            - unknown
        confirmed_at:
          type: string
          format: date-time
      required:
        - recorded
        - revision
    NutritionReport:
      type: object
      required:
        - days
        - daily
        - excluded
      properties:
        days:
          type: integer
        daily:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
                format: date
              meals:
                type: integer
              slots:
                type: integer
              lines:
                type: integer
              known_lines:
                type: integer
              estimated_lines:
                type: integer
              energy:
                type: number
                nullable: true
              protein:
                type: number
                nullable: true
              fat:
                type: number
                nullable: true
              carbs:
                type: number
                nullable: true
              fiber:
                type: number
                nullable: true
              vegetable_grams:
                type: number
                nullable: true
              dark_grams:
                type: number
                nullable: true
              unknown_vegetables:
                type: integer
              protein_low_streak:
                type: boolean
              confirmed_mass_lines:
                type: integer
            required:
              - day
              - meals
              - slots
              - lines
              - known_lines
              - estimated_lines
              - energy
              - protein
              - fat
              - carbs
              - fiber
              - vegetable_grams
              - dark_grams
              - unknown_vegetables
              - protein_low_streak
              - confirmed_mass_lines
        excluded:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              unit:
                type: string
              reason:
                type: string
            required:
              - name
              - unit
              - reason
    MonthlyReport:
      type: object
      required:
        - month
        - timezone
        - currency
        - as_of
        - summary
        - item_count
        - items
        - items_limit
        - cost_basis
        - purchase_period_basis
        - historical_outbound_repriced
      properties:
        month:
          type: string
        timezone:
          type: string
        currency:
          type: string
          enum:
            - CNY
        as_of:
          type: string
          format: date-time
        item_count:
          type: integer
          minimum: 0
        items_limit:
          type: integer
          enum:
            - 200
        cost_basis:
          type: string
          enum:
            - immutable_purchase_allocations
        purchase_period_basis:
          type: string
          enum:
            - cost_recorded_at
        historical_outbound_repriced:
          type: boolean
          enum:
            - false
        summary:
          type: object
          required:
            - outbound_events
            - priced_outbound_events
            - unknown_outbound_events
            - estimated_outbound_events
            - known_consumed_cost
            - known_wasted_cost
            - purchase_records
            - recorded_purchase_cost
          properties:
            outbound_events:
              type: integer
              minimum: 0
            priced_outbound_events:
              type: integer
              minimum: 0
            unknown_outbound_events:
              type: integer
              minimum: 0
            estimated_outbound_events:
              type: integer
              minimum: 0
            known_consumed_cost:
              type: string
              pattern: ^\d+\.\d{2}$
            known_wasted_cost:
              type: string
              pattern: ^\d+\.\d{2}$
            purchase_records:
              type: integer
              minimum: 0
            recorded_purchase_cost:
              type: string
              pattern: ^\d+\.\d{2}$
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required:
              - ingredient
              - unit
              - inbound_milli
              - consumed_milli
              - wasted_milli
              - adjusted_milli
              - known_consumed_cost
              - known_wasted_cost
              - unknown_outbound_events
            properties:
              ingredient:
                type: string
              unit:
                type: string
                nullable: true
              inbound_milli:
                type: string
              consumed_milli:
                type: string
              wasted_milli:
                type: string
              adjusted_milli:
                type: string
              known_consumed_cost:
                type: string
              known_wasted_cost:
                type: string
              unknown_outbound_events:
                type: integer
                minimum: 0
