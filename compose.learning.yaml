# Standalone learning deployment. Never overlay the development/acceptance stack.
name: foodflow-learning
x-runtime: &runtime
  image: foodflow-api:learning
  init: true
  user: '10001:10001'
  read_only: true
  tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  stop_grace_period: 15s
  logging: &logging
    driver: json-file
    options: {max-size: '10m', max-file: '3'}
x-app-env: &app_env
  DATABASE_URL: postgres://foodflow:${POSTGRES_PASSWORD:?Initialize learning configuration}@db:5432/foodflow?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:?Initialize learning configuration}
  APP_ORIGIN: http://127.0.0.1:17173
  HTTP_ADDR: :8080
  TRUSTED_PROXIES: '172.29.170.10'
  STORAGE_BACKEND: local
  IMAGE_STORAGE_DIR: /app/data/images
  MARKET_PRICE_SYNC: 'false'
  # Paid integrations stay off until recovery and budget controls are accepted.
  MODEL_ENDPOINT: ''
  MODEL_NAME: ''
  MODEL_API_KEY: ''
  VISION_MODEL_ENDPOINT: ''
  VISION_MODEL_NAME: ''
  VISION_MODEL_API_KEY: ''
  SMS_PROVIDER: ''
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodflow
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Initialize learning configuration}
    volumes: [learning_db:/var/lib/postgresql/data]
    networks: [database]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U foodflow -d foodflow']
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *runtime
    build:
      context: .
      args: {FOODFLOW_SOURCE_DIGEST: '${FOODFLOW_SOURCE_DIGEST:-unbound}'}
    command: [/app/migrate]
    environment: *app_env
    networks: [database]
    depends_on:
      db: {condition: service_healthy}
  image-init:
    <<: *runtime
    user: '0:0'
    cap_drop: [ALL]
    cap_add: [CHOWN]
    command: [chown, '10001:10001', /app/data/images]
    volumes: [learning_images:/app/data/images]
    networks: [database]
  api:
    <<: *runtime
    restart: unless-stopped
    environment: *app_env
    volumes: [learning_images:/app/data/images]
    networks:
      database: {}
      gateway: {}
    depends_on:
      migrate: {condition: service_completed_successfully}
      image-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:8080/health/ready']
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    <<: *runtime
    command: [/app/worker]
    restart: unless-stopped
    environment: *app_env
    volumes: [learning_images:/app/data/images]
    networks: [database]
    depends_on:
      migrate: {condition: service_completed_successfully}
      image-init: {condition: service_completed_successfully}
  web:
    image: foodflow-web:learning
    build:
      context: ./web
      args: {FOODFLOW_SOURCE_DIGEST: '${FOODFLOW_SOURCE_DIGEST:-unbound}'}
    restart: unless-stopped
    user: '101:101'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101
    logging: *logging
    ports: ['127.0.0.1:17173:80']
    networks:
      gateway: {ipv4_address: 172.29.170.10}
    depends_on:
      api: {condition: service_healthy}
networks:
  database:
    internal: true
  gateway:
    ipam:
      config: [{subnet: 172.29.170.0/24}]
volumes:
  learning_db:
  learning_images:
