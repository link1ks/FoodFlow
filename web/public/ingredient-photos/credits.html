<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodFlow 食材图片说明</title><style>body{max-width:760px;margin:60px auto;padding:0 24px;background:#faf8f3;color:#304735;font:16px/1.9 system-ui}a{color:#356746}</style><h1>食材图片说明</h1><p>目录中的 200 张图片为 AI 生成的写实棚拍风参考图，由 OpenAI 内置 imagegen 于 2026 年 10 月 19 日制作，并统一为 480×360 WebP。它们用于辅助辨认食材，不代表用户实际库存、数量、新鲜程度或实际拍摄的照片。</p><p>用户自行上传的实拍照片优先展示，与目录参考图分开存储。图片悬停不弹出来源信息。</p><p><a href="manifest.json">图片与校验清单</a></p><p>此前使用的开放授权照片及其署名、许可和处理记录保留于项目 Git 历史（6dcadac），不再作为当前目录配图。</p></html>
