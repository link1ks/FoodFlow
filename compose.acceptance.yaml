name: foodflow-acceptance
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodflow
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use scripts/local-acceptance.ps1}
    volumes: [acceptance_db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U foodflow -d foodflow"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    image: foodflow-api:acceptance
    build:
      context: .
      args: {FOODFLOW_SOURCE_DIGEST: '${FOODFLOW_SOURCE_DIGEST:-unbound}'}
    command: [/app/migrate]
    environment:
      DATABASE_URL: postgres://foodflow:${POSTGRES_PASSWORD}@db:5432/foodflow?sslmode=disable
    depends_on:
      db: {condition: service_healthy}
  api:
    image: foodflow-api:acceptance
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    environment: &app_env
      DATABASE_URL: postgres://foodflow:${POSTGRES_PASSWORD}@db:5432/foodflow?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Use scripts/local-acceptance.ps1}
      APP_ORIGIN: http://127.0.0.1:15173
      HTTP_ADDR: :8080
      IMAGE_STORAGE_DIR: /app/data/images
      STORAGE_BACKEND: local
      MARKET_PRICE_SYNC: 'false'
      COMMUNITY_ADMIN_IDS: ${COMMUNITY_ADMIN_IDS:-}
      COMMUNITY_REVIEW_MODEL_ENDPOINT: http://review-fixture:8080/v1
      COMMUNITY_REVIEW_MODEL_NAME: deterministic-review-fixture
      COMMUNITY_REVIEW_MODEL_API_KEY: fixture-only
      SPEECH_MODEL_ENDPOINT: http://review-fixture:8080/v1
      SPEECH_MODEL_NAME: qwen3-asr-flash
      SPEECH_MODEL_API_KEY: fixture-only
      AI_ALLOWANCE_ENABLED: 'true'
      AI_MONTHLY_ALLOWANCE_CNY: '1000'
      AI_DAILY_CALL_LIMIT: '1000'
    volumes: [acceptance_images:/app/data/images]
    ports: ['127.0.0.1:18080:8080']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:8080/health/ready']
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    image: foodflow-api:acceptance
    init: true
    command: [/app/worker]
    restart: unless-stopped
    stop_grace_period: 15s
    environment: *app_env
    volumes: [acceptance_images:/app/data/images]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    image: foodflow-web:acceptance
    build:
      context: ./web
      args: {FOODFLOW_SOURCE_DIGEST: '${FOODFLOW_SOURCE_DIGEST:-unbound}'}
    restart: unless-stopped
    ports: ['127.0.0.1:15173:80']
    depends_on:
      api: {condition: service_healthy}
  # Local deterministic model fixture only; never contacts a real provider.
  review-fixture:
    image: node:24-alpine
    command: [node, /fixture/review-model.cjs]
    volumes: ['./tests/fixtures/review-model.cjs:/fixture/review-model.cjs:ro']
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  acceptance_db:
  acceptance_images:
