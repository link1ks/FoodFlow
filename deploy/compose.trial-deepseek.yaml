# Opt in only after authorizing billable DeepSeek calls. Keep other trial overrides.
services:
  api:
    environment: &deepseek_env
      AI_ALLOWANCE_ENABLED: '${AI_ALLOWANCE_ENABLED:-false}'
      AI_MONTHLY_ALLOWANCE_CNY: '${AI_MONTHLY_ALLOWANCE_CNY:-5}'
      AI_TEXT_CALL_ALLOWANCE_CNY: '${AI_TEXT_CALL_ALLOWANCE_CNY:-0.10}'
      AI_IMAGE_CALL_ALLOWANCE_CNY: '${AI_IMAGE_CALL_ALLOWANCE_CNY:-0.50}'
      AI_DAILY_CALL_LIMIT: '${AI_DAILY_CALL_LIMIT:-20}'
      AI_CONCURRENT_CALL_LIMIT: '${AI_CONCURRENT_CALL_LIMIT:-1}'
      MODEL_ENDPOINT: '${MODEL_ENDPOINT:?Set the saved DeepSeek endpoint}'
      MODEL_NAME: '${MODEL_NAME:?Set deepseek-flash}'
      MODEL_API_KEY: '${MODEL_API_KEY:?Set the saved DeepSeek key}'
      VISION_MODEL_ENDPOINT: '${MODEL_ENDPOINT:?Set the saved DeepSeek endpoint}'
      VISION_MODEL_NAME: '${MODEL_NAME:?Set deepseek-flash}'
      VISION_MODEL_API_KEY: '${MODEL_API_KEY:?Set the saved DeepSeek key}'
  worker:
    environment: *deepseek_env
